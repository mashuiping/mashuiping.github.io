<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">逐轮修复后，请求期新增的 Triton kernel 数</title>
  <desc id="desc">初始轮 17 个，补上 V2 预热后 4 个，补普通采样参数预热后 1 个，消除 DFlash 多余特化后 0 个。中间轮次没有同口径的首 token 时间，不能计算每轮节省秒数。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1527"/><stop offset="1" stop-color="#17283f"/></linearGradient>
    <linearGradient id="b1"><stop stop-color="#ed6758"/><stop offset="1" stop-color="#f3a05b"/></linearGradient>
    <linearGradient id="b2"><stop stop-color="#4d91d7"/><stop offset="1" stop-color="#82bdf3"/></linearGradient>
    <linearGradient id="b3"><stop stop-color="#4bb7b5"/><stop offset="1" stop-color="#82d9c4"/></linearGradient>
  </defs>
  <rect width="1200" height="610" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" fill="#f5f8ff" font-size="30" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">每一步消掉了多少请求期编译？</text>
  <text x="64" y="107" fill="#adbed1" font-size="19" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">冷 Triton 缓存 · 首请求新增 kernel 数</text>
  <text x="64" y="179" fill="#e6eef9" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">初始</text>
  <rect x="342" y="140" width="698" height="55" rx="11" fill="url(#b1)"/>
  <text x="1013" y="177" text-anchor="end" fill="#172235" font-size="26" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">17 个</text>
  <text x="64" y="273" fill="#e6eef9" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">补 V2 预热后</text>
  <rect x="342" y="234" width="164" height="55" rx="11" fill="url(#b2)"/>
  <text x="526" y="272" fill="#d6ecff" font-size="26" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">4 个</text>
  <text x="64" y="367" fill="#e6eef9" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">补普通参数预热后</text>
  <rect x="342" y="328" width="42" height="55" rx="10" fill="url(#b3)"/>
  <text x="404" y="366" fill="#c9f3e4" font-size="26" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">1 个</text>
  <text x="64" y="461" fill="#e6eef9" font-size="22" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">处理 DFlash 后</text>
  <circle cx="354" cy="449" r="10" fill="#75d9bb"/>
  <text x="385" y="460" fill="#c9f3e4" font-size="26" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">0 个</text>
  <line x1="64" y1="514" x2="1136" y2="514" stroke="#3b4b62"/>
  <text x="64" y="558" fill="#aac0d6" font-size="17" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">逐轮实验只记录了请求期 kernel 数；没有同口径的逐轮首 token 时间，不能换算每步节省秒数。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">采样参数导致的两条 Triton 特化路径</title>
  <desc id="desc">复杂预热参数使 logits 升为 f32；默认请求保持 bf16。因此四个 verify kernel 需要不同的 Triton 缓存 key。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d182b"/><stop offset="1" stop-color="#1d2d46"/></linearGradient></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f4f8ff" font-size="31" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">同名 kernel，为什么还要编译？</text>
  <text x="64" y="110" fill="#aebed0" font-size="19" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">差异不在 kernel 名，而在输入 dtype 产生的特化 key</text>
  <rect x="64" y="154" width="494" height="360" rx="22" fill="#243c54" stroke="#3d6580" stroke-width="2"/>
  <rect x="642" y="154" width="494" height="360" rx="22" fill="#263747" stroke="#46736f" stroke-width="2"/>
  <text x="98" y="204" fill="#8dc4ff" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">第一轮预热</text>
  <text x="676" y="204" fill="#86e1cc" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">默认真实请求</text>
  <text x="98" y="258" fill="#ecf4ff" font-size="21" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">temperature / top-p / penalty 等</text>
  <text x="676" y="258" fill="#ecf4ff" font-size="21" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">普通采样参数</text>
  <path d="M298 282v44" stroke="#85a9c6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M876 282v44" stroke="#85a9c6" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="96" y="334" width="428" height="63" rx="12" fill="#375777"/>
  <rect x="674" y="334" width="428" height="63" rx="12" fill="#366758"/>
  <text x="310" y="374" text-anchor="middle" fill="#fff" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">logits → f32</text>
  <text x="888" y="374" text-anchor="middle" fill="#fff" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">logits 保持 bf16</text>
  <text x="98" y="456" fill="#cce1f7" font-size="21" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">verify 链：4 个 f32 特化 key</text>
  <text x="676" y="456" fill="#d1f3e8" font-size="21" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">verify 链：4 个 bf16 特化 key</text>
  <text x="64" y="568" fill="#b1c5d9" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC',sans-serif">补一轮普通采样参数预热，才会在服务就绪前生成右侧的 key。</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" fill="#85a9c6"/></marker></defs>
</svg>
